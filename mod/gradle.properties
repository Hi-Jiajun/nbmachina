# 内存 / 并行
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 与配置缓存尚未兼容
org.gradle.configuration-cache=false

# 本机外网必须走代理（见 docs/M3-mod-spike-report.md）
systemProp.http.proxyHost=192.168.1.201
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=192.168.1.201
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# Fabric 版本（2026-09-14 从 https://fabricmc.net/develop 对应接口查得）
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.3
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.138.4+1.21.10

# Mod 属性
mod_version=0.8.3
maven_group=net.nbmachina
archives_base_name=nbmachina
